# Single source of truth for the build portal.
# Read by scripts/portal.py (CI matrix + site data) and, via the generated
# site/data/schema.json, by the configurator in site/.
#
# Every switch value is a string: "ON" / "OFF" (bool) or "DEFAULT" / "ON" / "OFF" (tristate).
# A switch left at its source value is omitted from the build id, so ids stay stable
# when new switches are added.

# Optional "owner/name" of a GitHub repo. If set, unbuilt configurations get a "Request this build" issue link.
# Leave empty for a public site that should not link to GitHub.
repo: ""

# Base compiler flags that the presets set in RTS_FLAGS. Define switches are appended to it with semicolons.
flags_base: "/W3"

# `universal` builds both games in one package (CMake builds both when neither game is switched off).
# Variants (tier 2) are only made per single game, to keep the planned set small.
games:
  - { id: universal, name: "Universal (both games)", cmake: { RTS_BUILD_GENERALS: "ON", RTS_BUILD_ZEROHOUR: "ON" }, ci_name: Universal, tier2: false }
  - { id: generals, name: "Generals",  cmake: { RTS_BUILD_GENERALS: "ON",  RTS_BUILD_ZEROHOUR: "OFF" }, ci_name: Generals }
  - { id: zh,       name: "Zero Hour", cmake: { RTS_BUILD_GENERALS: "OFF", RTS_BUILD_ZEROHOUR: "ON"  }, ci_name: GeneralsMD }

compilers:
  - id: vc6
    name: "Visual C++ 6 SP6"
    note: "The only compiler that is CRC-compatible with retail Generals 1.08 / Zero Hour 1.04."
    retail_crc: true
  - id: msvc
    name: "Modern MSVC (VS2022)"
    note: "Not CRC-compatible with retail. Cannot play online against retail clients."
    retail_crc: false

# Which CMake preset each (compiler, config) pair maps to. Missing pair = not buildable.
configs:
  - id: release
    name: "Release"
    presets: { vc6: vc6, msvc: win32 }
  - id: profile
    name: "Profile"
    presets: { vc6: vc6-profile, msvc: win32-profile }
  - id: debug
    name: "Debug"
    presets: { vc6: vc6-debug, msvc: win32-debug }
  - id: releaselog
    name: "Release + logging"
    presets: { vc6: vc6-releaselog }
  - id: weekly
    name: "Weekly (VC6 full debug info)"
    presets: { vc6: vc6-weekly }

# When a preset exists in a vcpkg flavour, FFmpeg selects it.
vcpkg_presets: { win32: win32-vcpkg, win32-profile: win32-vcpkg-profile, win32-debug: win32-vcpkg-debug }

# Condition grammar (all keys in one object must hold):
#   compiler: [ids]   config: [ids]   game: [ids]   switch: id + in: [values] | not_in: [values]
groups:
  - id: retail
    name: "Retail compatibility"
  - id: bugs
    name: "Retail bugs and quirks"
    note: "ON keeps the original retail behaviour, OFF applies the fix. Changing these can change gameplay and stop matches from staying in sync with other players."
  - id: compat
    name: "Retail compatibility, in detail"
    note: "Only available while the Retail compatibility switch above is on Auto. Setting it to ON or OFF sets all of these at once."
  - id: gameplay
    name: "Gameplay and interface"
  - id: files
    name: "Files and loading"
  - id: debug
    name: "Debug features"
  - id: memory
    name: "Memory"
  - id: extras
    name: "Extras"

switches:
  # --- Retail compatibility -------------------------------------------------
  - id: retail_compat
    cmake: RTS_BUILD_OPTION_RETAIL_COMPATIBLE_GAME
    group: retail
    type: tristate
    default: DEFAULT
    help: "OFF enables retail-incompatible fixes (CRC, data, save and network changes). Auto leaves each detail switch below as the source has it; ON or OFF sets them all."

  # --- Debug features -------------------------------------------------------
  - id: debug_logging
    cmake: RTS_DEBUG_LOGGING
    group: debug
    type: tristate
    default: DEFAULT
    help: "Debug logging. Auto: on in debug builds."
  - id: debug_crashing
    cmake: RTS_DEBUG_CRASHING
    group: debug
    type: tristate
    default: DEFAULT
    help: "Debug assert dialogs. Auto: on in debug builds."
  - id: debug_stacktrace
    cmake: RTS_DEBUG_STACKTRACE
    group: debug
    type: tristate
    default: DEFAULT
    help: "Stack tracing. Implies debug logging. Auto: on in debug builds."
  - id: debug_profile
    cmake: RTS_DEBUG_PROFILE
    group: debug
    type: tristate
    default: DEFAULT
    help: "Debug profiling. Auto: on in debug builds."
  - id: debug_cheats
    cmake: RTS_DEBUG_CHEATS
    group: debug
    type: bool
    default: "OFF"
    warn: "Cheats in a release build. Do not use for multiplayer."
    help: "Debug cheats in release builds."
  - id: debug_multi_instance
    cmake: RTS_DEBUG_MULTI_INSTANCE
    group: debug
    type: bool
    default: "OFF"
    help: "Allow multiple client instances."
  - id: debug_log_in_crc_log
    cmake: RTS_DEBUG_INCLUDE_DEBUG_LOG_IN_CRC_LOG
    group: debug
    type: bool
    default: "OFF"
    help: "Include the normal debug log in the CRC log."
  - id: tracy
    cmake: RTS_BUILD_OPTION_PROFILE_TRACY
    group: debug
    type: bool
    default: "OFF"
    when: [{ config: [profile], compiler: [msvc] }]
    why: "Tracy needs a Profile build with modern MSVC."
    help: "Tracy profiler integration."
  - id: asan
    cmake: RTS_BUILD_OPTION_ASAN
    group: debug
    type: bool
    default: "OFF"
    when: [{ compiler: [msvc] }]
    why: "Address Sanitizer is not available for VC6."
    help: "Address Sanitizer. Forces the game memory allocator off."

  # --- Memory ---------------------------------------------------------------
  - id: gamememory
    cmake: RTS_GAMEMEMORY_ENABLE
    group: memory
    type: bool
    default: "ON"
    help: "Original game memory pool and dynamic memory allocator."
  - id: mp_override_malloc
    cmake: RTS_MEMORYPOOL_OVERRIDE_MALLOC
    group: memory
    type: bool
    default: "OFF"
    when: [{ switch: gamememory, in: ["ON"] }]
    why: "Needs the game memory allocator."
    help: "Route malloc through the dynamic memory allocator."
  - id: mp_dlink
    cmake: RTS_MEMORYPOOL_MPSB_DLINK
    group: memory
    type: bool
    default: "ON"
    when: [{ switch: gamememory, in: ["ON"] }]
    why: "Needs the game memory allocator."
    help: "Backlink on pool blocks: faster frees, more memory."
  - id: mp_debug
    cmake: RTS_MEMORYPOOL_DEBUG
    group: memory
    type: bool
    default: "ON"
    when: [{ switch: gamememory, in: ["ON"] }]
    why: "Needs the game memory allocator."
    help: "Memory pool debug support."
  - id: mp_debug_custom_new
    cmake: RTS_MEMORYPOOL_DEBUG_CUSTOM_NEW
    group: memory
    type: bool
    default: "ON"
    when: [{ switch: mp_debug, in: ["ON"] }]
    why: "Needs memory pool debug."
    help: "Custom operator new for the memory pool."
  - id: mp_debug_boundingwall
    cmake: RTS_MEMORYPOOL_DEBUG_BOUNDINGWALL
    group: memory
    type: bool
    default: "ON"
    when: [{ switch: mp_debug, in: ["ON"] }]
    why: "Needs memory pool debug."
    help: "Bounding-wall checks to find memory trampling."
  - id: mp_debug_checkpointing
    cmake: RTS_MEMORYPOOL_DEBUG_CHECKPOINTING
    group: memory
    type: bool
    default: "OFF"
    when: [{ switch: mp_debug, in: ["ON"] }]
    why: "Needs memory pool debug."
    help: "Record allocation history checkpoints."
  - id: mp_debug_stacktrace
    cmake: RTS_MEMORYPOOL_DEBUG_STACKTRACE
    group: memory
    type: bool
    default: "OFF"
    when: [{ switch: mp_debug, in: ["ON"] }]
    why: "Needs memory pool debug."
    warn: "Slows the game down significantly."
    help: "Stack trace per allocation."
  - id: mp_debug_intense_verify
    cmake: RTS_MEMORYPOOL_DEBUG_INTENSE_VERIFY
    group: memory
    type: bool
    default: "OFF"
    when: [{ switch: mp_debug, in: ["ON"] }]
    why: "Needs memory pool debug."
    warn: "Very slow."
    help: "Verify the pool after nearly every operation."
  - id: mp_debug_block_ownership
    cmake: RTS_MEMORYPOOL_DEBUG_CHECK_BLOCK_OWNERSHIP
    group: memory
    type: bool
    default: "OFF"
    when: [{ switch: mp_debug, in: ["ON"] }]
    why: "Needs memory pool debug."
    warn: "Very slow."
    help: "Check each block belongs to the pool it is freed to."
  - id: mp_debug_dma_bookkeeping
    cmake: RTS_MEMORYPOOL_DEBUG_INTENSE_DMA_BOOKKEEPING
    group: memory
    type: bool
    default: "OFF"
    when: [{ switch: mp_debug, in: ["ON"] }]
    why: "Needs memory pool debug."
    help: "Print memory pool usage statistics."
  - id: crashdump
    cmake: RTS_CRASHDUMP_ENABLE
    group: memory
    type: bool
    default: "ON"
    help: "Write crash dumps on unhandled exceptions."

  # --- Extras ---------------------------------------------------------------
  - id: ffmpeg
    cmake: RTS_BUILD_OPTION_FFMPEG
    group: extras
    type: bool
    default: "OFF"
    when: [{ compiler: [msvc] }]
    why: "FFmpeg comes from vcpkg, which needs modern MSVC."
    help: "Build with FFmpeg support (uses the vcpkg preset)."
  - id: tools
    cmake: RTS_BUILD_CORE_TOOLS
    group: extras
    type: bool
    default: "ON"
    help: "Build the mod tools."
  - id: extras
    cmake: RTS_BUILD_CORE_EXTRAS
    group: extras
    type: bool
    default: "OFF"
    help: "Build extra tools and tests."

