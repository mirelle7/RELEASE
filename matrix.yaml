    when: [{ game: [generals, universal] }]
    why: "Only exists in the Generals code."
    help: "Code that existed in Generals but was removed in Zero Hour. The source plans to remove it when the two games are merged."
  - id: feat_tell_computer_identity_in_lan_lobby
    define: TELL_COMPUTER_IDENTITY_IN_LAN_LOBBY
    group: gameplay
    title: "Computer identity in LAN lobby"
    type: bool
    default: "ON"
    labels: { "ON": "On", "OFF": "Off" }
    when: [{ config: [debug] }]
    why: "The source only compiles this in when RTS_DEBUG is defined (the Debug configuration)."
    help: "Tell your computer identity in the LAN lobby. Retail did, and exposed the login and host names. Turn off for privacy."
  - id: feat_enable_filesystem_logging
    define: ENABLE_FILESYSTEM_LOGGING
    group: files
    title: "File system logging"
    type: bool
    default: "OFF"
    labels: { "ON": "On", "OFF": "Off" }
    help: "Log file system activity."
  - id: feat_ww3d_enable_raw_anim_interpolation
    define: WW3D_ENABLE_RAW_ANIM_INTERPOLATION
    group: gameplay
    title: "Raw animation interpolation"
    type: bool
    default: "ON"
    labels: { "ON": "On", "OFF": "Off" }
    help: "Interpolate raw animations. Wanted for meshes that move and rotate, but not for animations that teleport meshes, such as blinking lights."

# Selections that are never buildable even though each switch is individually enabled.
rules:
  - if:      { switch: debug_stacktrace, in: ["ON"] }
    require: { switch: debug_logging, not_in: ["OFF"] }
    message: "Stack tracing implies debug logging, so logging cannot be OFF."
  - if:      { switch: asan, in: ["ON"] }
    require: { switch: gamememory, in: ["OFF"] }
    message: "ASAN needs the game memory allocator off (it overrides new/delete)."
  - if:      { config: [weekly] }
    require: { compiler: [vc6] }
    message: "The weekly config is VC6 only."

# Named builds that are built ahead of time.
#   tier 1: the CI presets, built as the source has them, for every game
#   tier 2: curated variants, built on a schedule
tier1:
  - { compiler: vc6,  config: release }
  - { compiler: vc6,  config: profile }
  - { compiler: vc6,  config: debug }
  - { compiler: vc6,  config: releaselog }
  - { compiler: vc6,  config: weekly }
  - { compiler: msvc, config: release }
  - { compiler: msvc, config: profile }
  - { compiler: msvc, config: debug }

tier2:
  - id: retail-off
    name: "Retail fixes enabled"
    blurb: "Retail compatibility OFF: gameplay and network fixes that break retail CRC."
    where: [{ compiler: [vc6, msvc], config: [release] }]
    switches: { retail_compat: "OFF" }
  - id: retail-on
    name: "Retail forced on"
    blurb: "Retail compatibility ON explicitly (what the source does anyway, kept as a reference build)."
    where: [{ compiler: [vc6, msvc], config: [release] }]
    switches: { retail_compat: "ON" }
  - id: no-gamememory
    name: "No game memory allocator"
    blurb: "Uses the CRT heap; handy for third-party memory tools."
    where: [{ compiler: [vc6, msvc], config: [release, debug] }]
    switches: { gamememory: "OFF" }
  - id: memory-paranoid
    name: "Memory pool paranoia"
    blurb: "Every memory pool checker on. Very slow; for hunting corruption."
    where: [{ compiler: [vc6, msvc], config: [debug] }]
    switches: { mp_debug_checkpointing: "ON", mp_debug_stacktrace: "ON", mp_debug_intense_verify: "ON", mp_debug_block_ownership: "ON", mp_debug_dma_bookkeeping: "ON" }
  - id: full-logging
    name: "Release with full diagnostics"
    blurb: "Logging, crash dialogs, stack traces and profiling in a release build."
    where: [{ compiler: [vc6, msvc], config: [release] }]
    switches: { debug_logging: "ON", debug_crashing: "ON", debug_stacktrace: "ON", debug_profile: "ON" }
  - id: cheats
    name: "Cheats enabled"
    blurb: "Debug cheats in a release build. Single player only."
    where: [{ compiler: [vc6, msvc], config: [release] }]
    switches: { debug_cheats: "ON" }
  - id: multi-instance
    name: "Multi-instance"
    blurb: "Run several clients on one machine for network testing."
    where: [{ compiler: [vc6, msvc], config: [release, debug] }]
    switches: { debug_multi_instance: "ON" }
  - id: asan
    name: "Address Sanitizer"
    blurb: "Debug build with ASAN. Game memory allocator is turned off."
    where: [{ compiler: [msvc], config: [debug] }]
    switches: { asan: "ON", gamememory: "OFF" }
  - id: tracy
    name: "Tracy profiler"
    blurb: "Profile build wired to the Tracy profiler."
    where: [{ compiler: [msvc], config: [profile] }]
    switches: { tracy: "ON" }
  - id: ffmpeg
    name: "FFmpeg"
    blurb: "Video decoding through FFmpeg (vcpkg)."
    where: [{ compiler: [msvc], config: [release] }]
    switches: { ffmpeg: "ON" }
  - id: all-bugs-kept
    name: "Every retail bug kept"
    blurb: "All retail bug switches ON: the original behaviour, quirks included."
    where: [{ compiler: [vc6, msvc], config: [release] }]
    switches: { bug_building_resumption_delay: "ON", bug_chinook_passenger_dumping: "ON", bug_hardcoded_black_lotus_cash_hack: "ON", bug_multi_crate_pickup: "ON", bug_no_xp_from_flame_kills: "ON", bug_no_xp_from_ocl_kills: "ON", bug_no_xp_from_poison_kills: "ON", bug_occupant_detection_via_drag_selection: "ON", bug_perpetual_horde_bonus: "ON", bug_premature_battle_bus_death: "ON", bug_radar_warning_suppression: "ON", bug_structure_stealth_during_repair: "ON", bug_tunnel_heal_stacking: "ON", bug_unreliable_firestorms: "ON", bug_sniping_empty_stinger_sites: "ON", bug_retail_scripted_camera: "ON", bug_retail_particles: "ON", bug_retail_nuke_missile_outer_radius_search: "ON", bug_retail_nuke_missile_outer_radius_damage: "ON" }
  - id: all-bugs-fixed
    name: "Every retail bug fixed"
    blurb: "All retail bug switches OFF: the fixed behaviour. Will not stay in sync with retail players."
    where: [{ compiler: [vc6, msvc], config: [release] }]
    switches: { bug_building_resumption_delay: "OFF", bug_chinook_passenger_dumping: "OFF", bug_hardcoded_black_lotus_cash_hack: "OFF", bug_multi_crate_pickup: "OFF", bug_no_xp_from_flame_kills: "OFF", bug_no_xp_from_ocl_kills: "OFF", bug_no_xp_from_poison_kills: "OFF", bug_occupant_detection_via_drag_selection: "OFF", bug_perpetual_horde_bonus: "OFF", bug_premature_battle_bus_death: "OFF", bug_radar_warning_suppression: "OFF", bug_structure_stealth_during_repair: "OFF", bug_tunnel_heal_stacking: "OFF", bug_unreliable_firestorms: "OFF", bug_sniping_empty_stinger_sites: "OFF", bug_retail_scripted_camera: "OFF", bug_retail_particles: "OFF", bug_retail_nuke_missile_outer_radius_search: "OFF", bug_retail_nuke_missile_outer_radius_damage: "OFF" }
