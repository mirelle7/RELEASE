    group: compat
    title: "CRC"
    type: bool
    default: "ON"
    labels: { "ON": "Retail", "OFF": "Changed" }
    when: [{ switch: retail_compat, in: ["DEFAULT"] }]
    why: "Set by the Retail compatibility switch above."
    help: "Game is expected to be CRC compatible with retail Generals 1.08 and Zero Hour 1.04."
  - id: compat_data
